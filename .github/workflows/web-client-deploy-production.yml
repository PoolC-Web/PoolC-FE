name: Deploy frontend to production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: poolc-frontend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - id: config
        name: Read deployment configuration
        run: |
          echo "aws_region=$(jq -r '.awsRegion' deploy/production.json)" >> "$GITHUB_OUTPUT"
          echo "role_arn=$(jq -r '.githubOidcRoleArn' deploy/production.json)" >> "$GITHUB_OUTPUT"
          echo "s3_bucket=$(jq -r '.s3Bucket' deploy/production.json)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(jq -r '.cloudFrontDistributionId' deploy/production.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @dialga/poolc.org check:type
      - run: yarn workspace @dialga/poolc.org build --mode prod
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ steps.config.outputs.aws_region }}
      - name: Publish static assets to S3
        run: aws s3 sync websites/poolc.org/build "s3://${{ steps.config.outputs.s3_bucket }}" --delete
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.config.outputs.distribution_id }}" --paths '/*'
