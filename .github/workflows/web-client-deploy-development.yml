name: Frontend CI and staging deploy

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: poolc-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: poolc-web/poolc-fe

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @dialga/poolc.org check:type
      - run: yarn workspace @dialga/poolc.org build

  image:
    name: Build and publish image
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  deploy:
    name: Update staging manifest
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Update PKS staging image
        env:
          GITOPS_TOKEN: ${{ secrets.POOLC_GITOPS_TOKEN }}
          IMAGE_TAG: ${{ needs.image.outputs.image_tag }}
        run: |
          set -euo pipefail
          test -n "$GITOPS_TOKEN"
          workdir="$(mktemp -d)"
          git clone --depth=1 "https://x-access-token:${GITOPS_TOKEN}@github.com/PoolC-Web/PKS.git" "$workdir"
          cd "$workdir"
          sed -i "s#image: ghcr.io/poolc-web/poolc-fe:[^[:space:]]*#image: ghcr.io/poolc-web/poolc-fe:${IMAGE_TAG}#" environments/poolc/staging/manifests/frontend.yaml
          git config user.name "PoolC staging CI"
          git config user.email "poolc-staging-ci@users.noreply.github.com"
          git add environments/poolc/staging/manifests/frontend.yaml
          git diff --cached --quiet || git commit -m "chore(staging): deploy frontend ${IMAGE_TAG}"
          git push
